# journald drop-in：在磁盘保存跨重启日志，并以空间和时间双重边界控制占用。
[Journal]
# 写入 /var/log/journal，而非仅保存在内存。
Storage=persistent
# 压缩达到阈值的历史 journal 文件。
Compress=yes
# 持久 journal 可使用的总空间上限。
SystemMaxUse=100M
# 即使未达总量上限也为文件系统保留至少 1 GiB。
SystemKeepFree=1G
# 单个 journal 文件达到该大小后轮转。
SystemMaxFileSize=10M
# 最多保留的归档文件数量。
SystemMaxFiles=20
# 记录最长保留三十天。
MaxRetentionSec=30day
# 单文件最多覆盖一天，便于按时间切分。
MaxFileSec=1day
