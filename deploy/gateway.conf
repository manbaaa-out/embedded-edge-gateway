# 网关运行配置模板，默认安装到 /etc/gateway.conf。键按热加载行为分组；执行
# `systemctl reload gateway` 发送 SIGHUP，配置管理器先完整校验再原子替换。

# 下列字段均可热加载：前三项由现有日志或 HTTP 路径在下一次读取时直接采用；
# mqtt_keepalive 需要重建 MQTT 客户端，才能写入新的 CONNECT 参数。
log_level    = 1          # 日志级别：0=DEBUG、1=INFO、2=WARN、3=ERROR。
idle_timeout = 5          # HTTP 连接空闲超时，单位为秒。
report_n     = 10         # /api/data 未提供 n 时的默认返回条数。
mqtt_keepalive = 60       # MQTT 保活间隔，单位为秒。

# 下列连接参数变化时，热加载会重建对应的串口、MQTT 客户端或数据库连接。
serial_path = /dev/serial0 # 板载 UART；USB 转串口通常使用 /dev/ttyUSB0。
serial_baud = 115200      # 支持 9600、19200、38400、57600、115200。
mqtt_host   = 192.168.1.6 # MQTT Broker 地址。
db_path     = /var/lib/gateway/gateway.db # SQLite 文件；目录由 systemd StateDirectory 创建。

# 运行期不重建监听器；修改后需重启服务。
mqtt_port    = 1883       # MQTT Broker TCP 端口。
http_port    = 8888       # 本地 HTTP 查询服务监听端口。
