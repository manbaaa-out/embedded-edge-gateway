# 开发机 Mosquitto 片段：同一 Broker 同时服务本机工具和树莓派网关。
# per_listener_settings 使认证策略随监听器独立配置；两个监听器均匿名，只能用于
# Hyper-V/主机防火墙已将局域网来源限制到目标树莓派的可信开发网络。

per_listener_settings true

# 回环监听器供 WSL 内的 mosquitto_pub/sub 和网关本机测试使用。
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

# 局域网监听器只绑定开发机指定地址，不在其他网卡上暴露 1883。
listener 1883 192.168.1.6
protocol mqtt
allow_anonymous true
