# 作为 /etc/mosquitto/conf.d/90-gateway-workstation.conf 安装。
# 同一个 Broker 同时服务本机客户端和树莓派网关。
#
# 局域网监听器只绑定开发机地址，避免在其他网卡上开放端口；Windows Hyper-V
# 防火墙还会把来源限制为树莓派 192.168.1.10。
# 网关当前没有 MQTT 用户名/密码配置，因此只应在可信局域网使用。

per_listener_settings true

listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true

listener 1883 192.168.1.6
protocol mqtt
allow_anonymous true
