<!DOCTYPE html>
<!--
  网关内嵌监控页。页面只依赖同一进程提供的 /api/data 与本地 uPlot 资源，
  每两秒并行刷新设备卡片，并为当前选中设备绘制最近历史；无需外部 CDN。
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Gateway Monitor</title>
<link rel="stylesheet" href="/uplot.css">
<style>
  /* 页面主题变量：背景、卡片、边框、正文、次要文字、正常和告警色。 */
  :root {
    --bg: #0f1117; --card: #1a1d27; --line: #2a2e3a;
    --txt: #e4e6eb; --muted: #8a8f9c; --accent: #22c55e; --warn: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--txt);
    max-width: 860px; margin: 0 auto; padding: 32px 16px;
  }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); transition: background .3s; }
  .dot.dead { background: var(--warn); }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; cursor: pointer; transition: border-color .2s;
  }
  .card:hover { border-color: #3a4050; }
  .card.active { border-color: var(--accent); }
  .card .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .card .value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .unit { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .card .time { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .card.stale .value { color: var(--muted); }
  /* 状态卡同时使用颜色、圆点和文字，避免只依赖单一视觉编码。 */
  .card .health { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; }
  .card .health-dot { width: 11px; height: 11px; border-radius: 50%; }
  .health.online  .health-dot { background: var(--accent); }
  .health.offline .health-dot { background: var(--warn); }
  .health.online  { color: var(--accent); }
  .health.offline { color: var(--warn); }
  .chart-wrap {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-top: 18px;
  }
  .chart-title { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  /* 让图表组件沿用页面的深色主题。 */
  .u-legend { color: var(--txt); }
  .uplot { font-family: inherit; }
  footer { margin-top: 26px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>Edge Gateway Monitor</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="conn">连接中…</span></span>
  </header>
  <p class="sub">实时传感器数据 · 每 2 秒自动刷新 · 数据源:本地 SQLite(只读连接,WAL 读写并发)</p>

  <div class="grid" id="grid"></div>

  <div class="chart-wrap">
    <div class="chart-title" id="chartTitle">历史曲线</div>
    <div id="chart"></div>
  </div>

  <footer>STM32 → UART → 网关(FSM 解析 / 线程池 / 落库 / MQTT 上云) → 本页查询</footer>

<script src="/uplot.js"></script>
<script>
// 每个设备描述符定义 API 标识、展示名称、单位、曲线颜色及是否为离散状态。
const DEVICES = [
  { id: "temperature",   name: "温度",   unit: "°C",  color: "#22c55e" },
  { id: "humidity",      name: "湿度",   unit: "%",   color: "#3b82f6" },
  { id: "illuminance",   name: "光照",   unit: "lux", color: "#f59e0b" },
  { id: "status_dht11",  name: "DHT11",  unit: "",    color: "#a855f7", isStatus: true },
  { id: "status_bh1750", name: "BH1750", unit: "",    color: "#ec4899", isStatus: true },
];
const HISTORY_N = 40;          // 曲线查询的最近点数上限。
let selected = "temperature"; // 当前卡片选择和曲线数据源的设备 id。
let chart = null;              // 当前 uPlot 实例；首次绘图前为空。

// 将 Unix 秒时间戳转为浏览器本地时间文本。
// ts: 后端返回的 Unix 秒；返回值用于卡片“采集于”字段。
function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString(); }

// 更新页面级连接指示。
// ok: 本轮全部卡片查询是否成功。
function setConn(ok) {
  document.getElementById("dot").className = ok ? "dot" : "dot dead";
  document.getElementById("conn").textContent = ok ? "已连接" : "连接异常";
}

// 拉取一个设备的历史序列。
// devId: /api/data 的逻辑设备标识；n: 请求的最近点数。
// 返回 uPlot 使用的升序时间和值数组，以及最后一个点 latest。
async function fetchHistory(devId, n) {
  const resp = await fetch(`/api/data?dev=${devId}&n=${n}`); // HTTP 响应对象。
  const arr = await resp.json(); // 后端按时间降序返回的数据库行数组。
  arr.reverse();
  return {
    ts:  arr.map(r => r.ts),    // 升序 Unix 秒数组；r 为当前历史行。
    val: arr.map(r => r.value), // 与 ts 同索引的读数数组。
    latest: arr.length ? arr[arr.length - 1] : null, // 最新行；无数据时为空。
  };
}

// 为指定设备创建一张空图表；切换数据源时重建以更新单位、颜色和坐标轴。
// dev: DEVICES 中当前选中的设备描述符。
function makeChart(dev) {
  const el = document.getElementById("chart"); // uPlot 挂载容器。
  el.innerHTML = "";

  const isStatus = !!dev.isStatus; // 是否使用 0/1 状态轴和阶梯线。

  const seriesOpts = { // y 序列的显示配置，状态量会在下方扩展。
    label: dev.name + (dev.unit ? ` (${dev.unit})` : ""),
    stroke: dev.color,
    width: 2,
    points: { show: true, size: 4 },
  };
  if (isStatus) {
    // 离散状态保持到下一次上报，使用阶梯线而非连续插值。
    seriesOpts.paths = uPlot.paths.stepped({ align: 1 });
    // u: uPlot 实例；v: 当前采样值。空值显示破折号，0/1 映射为状态文本。
    seriesOpts.value = (u, v) => (v == null ? "—" : (v >= 0.5 ? "在线" : "故障"));
  }

  const opts = { // 当前设备对应的完整 uPlot 配置对象。
    width: el.clientWidth || 800,
    height: 280,
    cursor: { drag: { x: true, y: false } },
    scales: {
      x: { time: true },
      // 状态图固定 0/1 范围；连续读数由 uPlot 自动缩放。
      y: isStatus ? { range: [-0.1, 1.1] } : {},
    },
    series: [
      {},  // 时间轴
      seriesOpts,
    ],
    axes: [
      { stroke: "#8a8f9c", grid: { stroke: "#2a2e3a" }, ticks: { stroke: "#2a2e3a" } },
      isStatus
        ? {
            stroke: "#8a8f9c",
            grid: { stroke: "#2a2e3a" }, ticks: { stroke: "#2a2e3a" },
            splits: () => [0, 1],
            // u: uPlot 实例；splits: y 轴刻度值；返回同长度的中文标签。
            values: (u, splits) => splits.map(v => (v >= 0.5 ? "在线" : "故障")),
          }
        : { stroke: "#8a8f9c", grid: { stroke: "#2a2e3a" }, ticks: { stroke: "#2a2e3a" } },
    ],
  };
  chart = new uPlot(opts, [[], []], el);
}

// 执行一次页面刷新：并行更新全部最新值，再更新当前历史曲线和连接状态。
async function refresh() {
  let allOk = true; // 任一卡片查询失败后置为 false。

  // 卡片仅查询各设备的最新读数。
  const cards = await Promise.all(DEVICES.map(async dev => { // dev 是当前设备描述符。
    try {
      const resp = await fetch(`/api/data?dev=${dev.id}&n=1`); // 最新值查询响应。
      const arr = await resp.json(); // 零条或一条数据库记录。
      const cls = (dev.id === selected) ? "card active" : "card"; // 卡片视觉状态。
      if (arr.length === 0)
        return `<div class="${cls} stale" data-dev="${dev.id}"><div class="label">${dev.name}</div><div class="value">—</div><div class="time">无数据</div></div>`;
      const r = arr[0]; // 当前设备最新一条读数。

      let valueHtml; // 卡片数值区的 HTML；状态量和连续量格式不同。
      if (dev.isStatus) {
        // 阈值判断避免依赖浮点数精确相等。
        const online = r.value >= 0.5; // true 映射“在线”，false 映射“故障”。
        valueHtml = `<span class="health ${online ? "online" : "offline"}">
                       <span class="health-dot"></span>${online ? "在线" : "故障"}
                     </span>`;
      } else {
        valueHtml = `${r.value}<span class="unit">${dev.unit}</span>`;
      }

      return `<div class="${cls}" data-dev="${dev.id}"><div class="label">${dev.name}</div>
              <div class="value">${valueHtml}</div>
              <div class="time">采集于 ${fmtTime(r.ts)}</div></div>`;
    } catch (e) { // e 是本设备查询或 JSON 解码失败的异常。
      allOk = false;
      return `<div class="card stale" data-dev="${dev.id}"><div class="label">${dev.name}</div><div class="value" style="color:var(--warn)">错误</div><div class="time">${e}</div></div>`;
    }
  }));
  document.getElementById("grid").innerHTML = cards.join("");

  // 点击卡片后切换曲线数据源。
  document.querySelectorAll(".card").forEach(c => { // c 是本轮重建后的单张卡片元素。
    c.onclick = () => { selected = c.dataset.dev; redrawChart(); refresh(); };
  });

  await redrawChart();
  setConn(allOk);
}

// 查询并绘制 selected 对应的历史数据；单次失败留待下一刷新周期重试。
async function redrawChart() {
  const dev = DEVICES.find(d => d.id === selected); // 当前设备描述符；d 为查找候选项。
  document.getElementById("chartTitle").textContent = `历史曲线 — ${dev.name}`;
  try {
    const h = await fetchHistory(selected, HISTORY_N); // 升序历史序列。
    // 用自定义标记判断图表配置是否与当前数据源匹配。
    if (!chart || chart._devId !== selected) {
      makeChart(dev);
      chart._devId = selected;
    }
    chart.setData([h.ts, h.val]);
  } catch (e) { /* e 为本次历史查询/绘图异常；下一个刷新周期会重试。 */ }
}

// 首次加载后每两秒刷新一次。
refresh();
setInterval(refresh, 2000);
window.addEventListener("resize", () => {
  const d = DEVICES.find(x => x.id === selected); // d 为当前设备；x 为查找候选项。
  makeChart(d);
  chart._devId = selected;
  redrawChart();
});
</script>
</body>
</html>
