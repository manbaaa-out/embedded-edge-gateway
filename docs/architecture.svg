<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Noto Sans CJK SC,Microsoft YaHei,Arial,sans-serif">
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8Z" fill="#52647b"/></marker></defs>
  <rect width="1280" height="820" fill="#f7f9fc"/>
  <g fill="#20314c"><text x="48" y="52" font-size="26" font-weight="bold">边缘网关 · 多 I/O 事件循环 + 共享业务线程</text>
    <text x="48" y="83" font-size="15">单进程；连接与协议状态归各自 I/O 线程，应用状态归 GatewayCore，跨线程以有界消息交接。</text></g>
  <g stroke="#416fa4" fill="#e9f1fc" stroke-width="1.5">
    <rect x="48" y="126" width="360" height="174" rx="12"/>
    <rect x="460" y="126" width="360" height="174" rx="12"/>
    <rect x="872" y="126" width="360" height="174" rx="12"/>
  </g>
  <g fill="#20314c" font-size="16" text-anchor="middle">
    <text x="228" y="160" font-size="20" font-weight="bold">串口 Reactor · 主线程</text>
    <text x="228" y="192">epoll / eventfd / timerfd</text>
    <text x="228" y="222">非阻塞收发 · 组帧 / CRC · SR 会话</text>
    <text x="228" y="252">CommandTracker · 重传 / 确认 / 超时</text>
    <text x="228" y="280">唯一串口写者与链路状态所有者</text>
    <text x="640" y="160" font-size="20" font-weight="bold">MQTT 网络循环 · 库线程</text>
    <text x="640" y="192">libmosquitto loop_start</text>
    <text x="640" y="222">网络收发 · MQTT 协议与保活</text>
    <text x="640" y="252">回调复制 topic / payload 后投递</text>
    <text x="640" y="280">准入失败返回固定 busy 回执</text>
    <text x="1052" y="160" font-size="20" font-weight="bold">HTTP I/O 循环 · 专用线程</text>
    <text x="1052" y="192">Boost.Beast + Asio io_context</text>
    <text x="1052" y="222">连接 / HTTP 解析 / 异步收发 / 超时</text>
    <text x="1052" y="252">请求投递业务线程，响应 post 回本循环</text>
    <text x="1052" y="280">每连接限流，迟到回复安全丢弃</text>
  </g>
  <g stroke="#52647b" stroke-width="2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M228 309 V371"/><path d="M640 309 V371" marker-start="none"/><path d="M1052 309 V371"/>
  </g>
  <g font-size="14" fill="#435673" text-anchor="middle">
    <text x="228" y="341" dx="95">帧 / 终态 ↔ 命令</text>
    <text x="640" y="341" dx="99">原始消息</text>
    <text x="1052" y="341" dx="99">请求 ↔ 响应</text>
  </g>
  <rect x="48" y="382" width="1184" height="140" rx="12" fill="#e8f4eb" stroke="#48865b" stroke-width="1.5"/>
  <g fill="#244b31" text-anchor="middle">
    <text x="640" y="417" font-size="22" font-weight="bold">GatewayCore · 单一业务执行线程</text>
    <text x="640" y="451" font-size="17">命令翻译与校验 · 遥测解码与分发 · HTTP 路由与 JSON · MQTT 结果格式化</text>
    <text x="640" y="485" font-size="15">最多 512 条待完成 / 待发布命令；邮箱 1024 个普通位置 + 552 个完成事件预留位置</text>
    <text x="640" y="508" font-size="14">业务线程不等待 I/O；阻塞资源操作交给下方专用执行器</text>
  </g>
  <g stroke="#52647b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M228 522 V572"/><path d="M640 522 V572" marker-start="url(#arrow)"/><path d="M1052 522 V572"/>
  </g>
  <g fill="#fdf3df" stroke="#ae863a" stroke-width="1.5">
    <rect x="48" y="581" width="360" height="131" rx="12"/>
    <rect x="460" y="581" width="360" height="131" rx="12"/>
    <rect x="872" y="581" width="360" height="131" rx="12"/>
  </g>
  <g fill="#654d20" text-anchor="middle" font-size="16">
    <text x="228" y="614" font-size="20" font-weight="bold">SQLite 写线程</text>
    <text x="228" y="647">遥测有界队列 · 批量事务 · WAL</text>
    <text x="228" y="678">按写队列顺序切库，再发布读连接</text>
    <text x="640" y="614" font-size="20" font-weight="bold">SQLite 查询线程</text>
    <text x="640" y="647">只读连接快照 · 最多 32 个在途查询</text>
    <text x="640" y="678">查询完成回 Core，再回 HTTP 循环</text>
    <text x="1052" y="614" font-size="20" font-weight="bold">控制线程</text>
    <text x="1052" y="647">MQTT 发布 / 替换 · 配置 / 资源准备</text>
    <text x="1052" y="678">串口仅预开，由串口 Reactor 激活</text>
  </g>
  <g fill="#52647b" font-size="14">
    <text x="48" y="755">MQTT 发布调用完成后释放命令额度；不等于 broker ACK / 云端业务完成，目前没有持久化 outbox。</text>
    <text x="48" y="783">Asio 提供异步完成式接口；这里按多个独立 I/O 循环描述架构，不把库 API 与 Linux 内部就绪机制混为一谈。</text>
  </g>
</svg>
