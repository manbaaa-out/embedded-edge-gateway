name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ------------------------------------------------------------
  # 1. 构建 + 单测。-Werror 守住零警告基线。
  # ------------------------------------------------------------
  build-and-test:
    name: 构建 + 单测 (零警告)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
                                  libsqlite3-dev libmosquitto-dev

      - name: 配置
        run: cmake --preset dev

      - name: 构建
        run: cmake --build --preset dev

      - name: 单测
        run: ctest --preset dev

      # Release 走 -O2,glibc 的 _FORTIFY_SOURCE 才会生效 —— read/write 的
      # warn_unused_result 这类警告【只在优化开启时出现】。只构建 Debug 是抓不到的。
      - name: Release 构建(优化开启后才暴露的警告)
        run: |
          cmake --preset release -DGATEWAY_WARNINGS_AS_ERRORS=ON
          cmake --build --preset release

      - name: 安装可重定位性
        run: |
          cmake --install build/release --prefix /tmp/install_check
          test -x /tmp/install_check/bin/gateway
          test -f /tmp/install_check/etc/gateway.conf
          test -f /tmp/install_check/lib/systemd/system/gateway.service

  # ------------------------------------------------------------
  # 2. Sanitizer。ASan 查 use-after-free —— 正是热加载 reset db_/client_
  #    时最怕的那类 bug;UBSan 查协议解析里的移位与窄化。
  # ------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
                                  libsqlite3-dev libmosquitto-dev

      - name: 构建 + 单测
        run: |
          cmake --preset asan
          cmake --build --preset asan
          ctest --preset asan

  # ------------------------------------------------------------
  # 3. 共享协议核心必须能上 MCU。
  #
  #    protocol/ 声称"纯 C99、无 malloc/stdio/平台头、可直接编进固件"——
  #    这个 job 用编译器证明它,而不是让 README 自说自话。
  #    任何一个 #include <stdio.h> 都会在这里当场暴露。
  # ------------------------------------------------------------
  protocol-portability:
    name: 协议核心可移植性 (arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 ARM 工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: 按 Cortex-M3 freestanding 编译
        run: |
          mkdir -p /tmp/armout && cd /tmp/armout
          arm-none-eabi-gcc -std=c99 -Wall -Wextra -Wpedantic \
              -Wconversion -Wsign-conversion -Wshadow -Werror \
              -mcpu=cortex-m3 -mthumb -ffreestanding -Os \
              -c $GITHUB_WORKSPACE/protocol/src/*.c \
              -I$GITHUB_WORKSPACE/protocol/include
          arm-none-eabi-size *.o

      - name: 确认对 libc 零依赖
        run: |
          cd /tmp/armout
          # 未定义符号应当只有协议自己的函数。出现 malloc / printf / memcpy
          # 等 libc 符号,说明"零依赖"这条契约已经破了。
          if arm-none-eabi-nm -u *.o | grep -qE 'malloc|printf|free|memcpy|memset'; then
            echo "协议核心引入了 libc 依赖,违反可移植性契约"
            arm-none-eabi-nm -u *.o
            exit 1
          fi
          echo "OK:未定义符号中没有 libc"

      - name: 漂移守卫
        run: ./scripts/check_proto_sync.sh

  # ------------------------------------------------------------
  # 4. 格式检查 —— 只强制 protocol/。
  #
  # 那是两个仓库共享的源码,格式一致能让跨仓库 diff 保持干净,值得强制。
  # src/ 下的既有代码有大量手工对齐的中文注释,全量 clang-format 会产生
  # 上千处改动、且把对齐揉乱,收益不抵风险 —— 仓库根的 .clang-format
  # 仍然提供给编辑器与新代码使用,只是不在 CI 里一刀切。
  # ------------------------------------------------------------
  format:
    name: clang-format (protocol/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: 检查共享协议核心的格式
        run: |
          find protocol \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
